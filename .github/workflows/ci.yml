name: CI

# Runs on every pull request so changes are tested before they reach main.
# The publish workflow calls this too, so an image is only pushed once the
# same checks pass.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    name: Server typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Production dependencies only; moderate advisories are reported but
      # don't fail the build.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker image builds
    # Catches Dockerfile breakage on PRs; nothing is pushed. Skipped when
    # called from the publish workflow, which builds the image itself.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
