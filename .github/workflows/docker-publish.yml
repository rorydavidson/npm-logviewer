name: Publish Docker image

# Builds and pushes the image to Docker Hub so users can pull it instead of
# building locally. Pushes on commits to main, on version tags, and on demand.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Server tests
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image name
        id: image
        # Use the DOCKERHUB_IMAGE repo variable if set, else <owner>/<repo>.
        run: |
          if [ -n "${{ vars.DOCKERHUB_IMAGE }}" ]; then
            echo "name=${{ vars.DOCKERHUB_IMAGE }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.repository }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Refreshes the bundled GeoLite database at build time. Optional:
          # without the repo secret the build falls back to geoip-lite's own
          # (older) snapshot.
          secrets: |
            maxmind_license_key=${{ secrets.MAXMIND_LICENSE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
