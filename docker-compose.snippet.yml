# Paste this service into the SAME docker-compose.yml that runs Nginx Proxy
# Manager, so both containers share the NPM data volume.
#
# MOUNT POINTS (the important bit):
#   - The NPM `data` volume is mounted READ-ONLY at /data. This must be the
#     exact same source path NPM uses for its own /data mount, so we see its
#     logs (/data/logs) and database (/data/database.sqlite).
#   - A SEPARATE writable volume is mounted at /state for our own parsed-log
#     database. /data stays read-only; we never write to NPM's files.
#
# Adjust `./data` below to match your NPM compose (it is NPM's default).

services:
  logviewer:
    image: rorydavidson/npm-logviewer:latest   # published image; or build: ./nginx-logviewer
    container_name: npm-logviewer
    restart: unless-stopped
    depends_on:
      - app                          # NPM service name; rename to match yours
    environment:
      NPM_DATA: /data                # where the NPM volume is mounted (below)
      STATE_DB: /state/logviewer.sqlite
      SESSION_SECRET: ${LOGVIEWER_SECRET}   # set in your .env, 32+ random chars
      BACKFILL_DAYS: 14              # how much history to index on first boot
      SECURE_COOKIE: "true"          # set true when served over HTTPS via NPM
      RESEND_API_KEY: ${RESEND_API_KEY:-}   # optional: enables threat email alerts
      ALERT_FROM: ${ALERT_FROM:-ProxyLogs <onboarding@resend.dev>}
      SITE_URL: ${SITE_URL:-}               # e.g. https://logs.example.com (for email links)
      TZ: ${TZ:-UTC}
      # IP bans: set the NPM container name (and enable the docker-proxy
      # service below) to reload nginx automatically when bans change. Leave
      # unset to apply bans on NPM's next reload instead.
      # NPM_CONTAINER: npm-app
      # DOCKER_SOCKET: /run/docker-proxy/docker.sock
      # Runs as uid/gid 1000 by default. If you hit "unable to open database
      # file" or cannot read /data, set these to 0 (root) to match NPM:
      # PUID: 0
      # PGID: 0
    volumes:
      - ./data:/data:ro              # SAME source as NPM's /data mount
      - ./data/nginx/custom:/data/nginx/custom:rw   # writable: ban deny snippet
      - logviewer-state:/state       # our own writable DB lives here
      # Optional, for automatic nginx reload on ban changes. Do not mount the
      # real /var/run/docker.sock here: it is equivalent to root on the host.
      # - docker-proxy-socket:/run/docker-proxy
    # No published ports by default — proxy it through NPM itself (see README).
    # To reach it directly during setup, uncomment:
    # ports:
    #   - "8090:8090"

  # Optional: uncomment along with NPM_CONTAINER, DOCKER_SOCKET and the
  # docker-proxy-socket mount above.
  # # Filtered Docker API for the ban reload. The viewer never sees the real
  # # socket: this proxy allows only listing containers and running an exec
  # # (nginx -s reload), and refuses everything else (creating containers,
  # # mounting volumes, pulling images), which would otherwise be host root.
  # # It runs as root only to open the host socket; capabilities are dropped.
  # docker-proxy:
  #   image: wollomatic/socket-proxy:1.13.1
  #   restart: unless-stopped
  #   user: "0:0"
  #   read_only: true
  #   cap_drop: [ALL]
  #   security_opt: [no-new-privileges:true]
  #   network_mode: none
  #   command:
  #     - "-proxysocketendpoint=/run/docker-proxy/docker.sock"
  #     - "-proxysocketendpointfilemode=0666"
  #     - "-allowGET=/containers/json"
  #     - "-allowPOST=/containers/[a-zA-Z0-9_.-]+/exec"
  #     - "-allowPOST=/exec/[a-zA-Z0-9]+/start"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - docker-proxy-socket:/run/docker-proxy

volumes:
  logviewer-state:
  # docker-proxy-socket:
