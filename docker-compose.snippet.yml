# Paste this service into the SAME docker-compose.yml that runs Nginx Proxy
# Manager, so both containers share the NPM data volume.
#
# MOUNT POINTS (the important bit):
#   - The NPM `data` volume is mounted READ-ONLY at /data. This must be the
#     exact same source path NPM uses for its own /data mount, so we see its
#     logs (/data/logs) and database (/data/database.sqlite).
#   - A SEPARATE writable volume is mounted at /state for our own parsed-log
#     database. /data stays read-only; we never write to NPM's files.
#
# Adjust `./data` below to match your NPM compose (it is NPM's default).

services:
  logviewer:
    build: ./nginx-logviewer        # or: image: ghcr.io/you/nginx-logviewer:latest
    container_name: npm-logviewer
    restart: unless-stopped
    depends_on:
      - app                          # NPM service name; rename to match yours
    environment:
      NPM_DATA: /data                # where the NPM volume is mounted (below)
      STATE_DB: /state/logviewer.sqlite
      SESSION_SECRET: ${LOGVIEWER_SECRET}   # set in your .env, 32+ random chars
      BACKFILL_DAYS: 14              # how much history to index on first boot
      SECURE_COOKIE: "true"          # set true when served over HTTPS via NPM
      RESEND_API_KEY: ${RESEND_API_KEY:-}   # optional: enables threat email alerts
      ALERT_FROM: ${ALERT_FROM:-ProxyLogs <onboarding@resend.dev>}
      TZ: ${TZ:-UTC}
      # Runs as uid/gid 1000 by default. If you hit "unable to open database
      # file" or cannot read /data, set these to 0 (root) to match NPM:
      # PUID: 0
      # PGID: 0
    volumes:
      - ./data:/data:ro              # SAME source as NPM's /data mount
      - logviewer-state:/state       # our own writable DB lives here
    # No published ports by default — proxy it through NPM itself (see README).
    # To reach it directly during setup, uncomment:
    # ports:
    #   - "8090:8090"

volumes:
  logviewer-state:
